<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="coverBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A5F" />
      <stop offset="100%" stop-color="#16293F" />
    </linearGradient>
    <radialGradient id="coverGlow" cx="78%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#457B9D" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#457B9D" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E63946" />
      <stop offset="100%" stop-color="#457B9D" />
    </linearGradient>
  </defs>

  <g id="bg">
