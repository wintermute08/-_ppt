    <line x1="0" y1="540" x2="1280" y2="540" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" />
  </g>

  <g id="cover-tagline">
    <path fill="#E63946" fill-opacity="0.16" d="M98,180 H342 A18,18 0 0 1 360,198 V198 A18,18 0 0 1 342,216 H98 A18,18 0 0 1 80,198 V198 A18,18 0 0 1 98,180 Z" />
    <text x="220" y="204" text-anchor="middle" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="15" font-weight="bold" fill="#F4A7AE" letter-spacing="2">DATA ANALYSIS PROJECT</text>
  </g>

  <g id="cover-title">
    <text x="80" y="300" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="56" font-weight="bold" fill="#FFFFFF">전세계 자살률 데이터 분석</text>
    <path fill="url(#accentLine)" d="M87,330 H261 A3,3 0 0 1 264,333 V333 A3,3 0 0 1 261,336 H87 A3,3 0 0 1 84,333 V333 A3,3 0 0 1 87,330 Z" />
    <text font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" fill="#B9C6D6" font-size="24" x="80" y="392"><tspan>1985–2016, <tspan fill="#FFFFFF" font-weight="bold">101개국 27,820건</tspan>의 데이터가</tspan>
      </text><text font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" fill="#B9C6D6" font-size="24" x="80" y="430">말해주는 위험의 패턴</text></g>

  <g id="cover-kpis">
    <text x="80" y="500" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="15" fill="#8DA3BB" letter-spacing="1">머신러닝 분류 정확도</text>
    <text x="80" y="545" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="40" font-weight="bold" fill="#E63946">80.18%</text>
    <line x1="320" y1="480" x2="320" y2="550" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1" />
    <text x="360" y="500" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="15" fill="#8DA3BB" letter-spacing="1">가장 취약한 집단</text>
    <text x="360" y="545" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="40" font-weight="bold" fill="#FFFFFF">75세+ 남성</text>
    <line x1="680" y1="480" x2="680" y2="550" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1" />
    <text x="720" y="500" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="15" fill="#8DA3BB" letter-spacing="1">핵심 발견</text>
    <text x="720" y="545" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="40" font-weight="bold" fill="#FFFFFF">발전의 역설</text>
  </g>

  <g id="cover-footer">
    <line x1="80" y1="630" x2="1200" y2="630" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1" />
    <text x="80" y="668" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="14" fill="#8DA3BB">데이터 분석 프로젝트 발표 · 2026.06</text>
    <text x="1200" y="668" text-anchor="end" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="14" fill="#8DA3BB">Source: Suicide Rates Overview 1985–2016 (Kaggle)</text>
