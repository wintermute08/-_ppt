    <text x="736" y="540" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2B2D33">윤리적 해석 주의</text>
    <text font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" fill="#5C6470" font-size="14" x="736" y="572"><tspan>민감한 주제 — 특정 집단에 대한 <tspan font-weight="bold" fill="#E63946">낙인 효과 방지</tspan>,</tspan>
      </text><text font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" fill="#5C6470" font-size="14" x="736" y="596">결과 공개·활용 시 윤리 검토 필수</text></g>

  <g id="footer">
    <text x="1200" y="690" text-anchor="end" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="11" fill="#9AA3AF">13</text>
