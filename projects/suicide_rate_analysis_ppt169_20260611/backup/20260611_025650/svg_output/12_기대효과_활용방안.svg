<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="bg">
    <rect width="1280" height="720" fill="#F5F7FA"/>
  </g>

  <g id="header">
    <rect x="80" y="50" width="5" height="60" rx="2.5" fill="#E63946"/>
    <text x="104" y="84" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1E3A5F">80% 정확도의 위험 식별은 예방 자원 배분의 근거가 된다</text>
    <text x="104" y="110" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#5C6470" letter-spacing="1">05 기대효과 · 활용방안</text>
  </g>

  <g id="label-effect">
    <rect x="80" y="146" width="160" height="34" rx="17" fill="#1E3A5F"/>
    <text x="160" y="169" text-anchor="middle" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">기대효과</text>
  </g>

  <g id="effect-1">
    <rect x="80" y="196" width="360" height="180" rx="14" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="1"/>
    <rect x="108" y="222" width="52" height="52" rx="13" fill="#1E3A5F" fill-opacity="0.08"/>
    <use data-icon="phosphor-duotone/target" x="116" y="230" width="36" height="36" fill="#1E3A5F"/>
    <text x="108" y="312" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2B2D33">고위험군 사전 식별</text>
    <text x="108" y="338" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="14" fill="#5C6470">
      <tspan x="108" dy="0">정확도 80.18% 모델로 개입이 필요한</tspan>
      <tspan x="108" dy="22">집단을 데이터로 먼저 찾는다</tspan>
    </text>
  </g>

  <g id="effect-2">
    <rect x="460" y="196" width="360" height="180" rx="14" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="1"/>
    <rect x="488" y="222" width="52" height="52" rx="13" fill="#1E3A5F" fill-opacity="0.08"/>
    <use data-icon="phosphor-duotone/users" x="496" y="230" width="36" height="36" fill="#1E3A5F"/>
    <text x="488" y="312" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2B2D33">타게팅 효율 극대화</text>
    <text x="488" y="338" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="14" fill="#5C6470">
      <tspan x="488" dy="0">중요도 67%인 연령·성별 기준으로</tspan>
      <tspan x="488" dy="22">고연령 남성 집중 개입 설계</tspan>
    </text>
  </g>

  <g id="effect-3">
    <rect x="840" y="196" width="360" height="180" rx="14" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="1"/>
    <rect x="868" y="222" width="52" height="52" rx="13" fill="#1E3A5F" fill-opacity="0.08"/>
    <use data-icon="phosphor-duotone/globe" x="876" y="230" width="36" height="36" fill="#1E3A5F"/>
    <text x="868" y="312" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2B2D33">국가군별 맞춤 정책</text>
    <text x="868" y="338" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="14" fill="#5C6470">
      <tspan x="868" dy="0">3개 위험 군집 구분으로 국가 특성에</tspan>
      <tspan x="868" dy="22">맞는 차등 정책 설계 가능</tspan>
    </text>
  </g>

  <g id="label-usage">
    <rect x="80" y="404" width="160" height="34" rx="17" fill="#E63946"/>
    <text x="160" y="427" text-anchor="middle" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">활용방안</text>
  </g>

  <g id="usage-1">
    <rect x="80" y="454" width="360" height="180" rx="14" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="1"/>
    <rect x="108" y="480" width="52" height="52" rx="13" fill="#E63946" fill-opacity="0.08"/>
    <use data-icon="phosphor-duotone/strategy" x="116" y="488" width="36" height="36" fill="#E63946"/>
    <text x="108" y="570" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2B2D33">정책 우선순위 지표</text>
    <text x="108" y="596" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="14" fill="#5C6470">
      <tspan x="108" dy="0">국가·지자체 자살예방 계획의</tspan>
      <tspan x="108" dy="22">근거 기반 우선순위 수립</tspan>
    </text>
  </g>

  <g id="usage-2">
    <rect x="460" y="454" width="360" height="180" rx="14" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="1"/>
    <rect x="488" y="480" width="52" height="52" rx="13" fill="#E63946" fill-opacity="0.08"/>
    <use data-icon="phosphor-duotone/chart-bar" x="496" y="488" width="36" height="36" fill="#E63946"/>
    <text x="488" y="570" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2B2D33">예산 배분 시뮬레이션</text>
    <text x="488" y="596" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="14" fill="#5C6470">
      <tspan x="488" dy="0">고위험 군집 국가·집단 우선의</tspan>
      <tspan x="488" dy="22">보건 예산 배분 검증</tspan>
    </text>
  </g>

  <g id="usage-3">
    <rect x="840" y="454" width="360" height="180" rx="14" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="1"/>
    <rect x="868" y="480" width="52" height="52" rx="13" fill="#E63946" fill-opacity="0.08"/>
    <use data-icon="phosphor-duotone/heartbeat" x="876" y="488" width="36" height="36" fill="#E63946"/>
    <text x="868" y="570" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2B2D33">조기 스크리닝 설계</text>
    <text x="868" y="596" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="14" fill="#5C6470">
      <tspan x="868" dy="0">노인 남성 대상 정신건강</tspan>
      <tspan x="868" dy="22">조기 검진 프로그램의 설계 근거</tspan>
    </text>
  </g>

  <g id="footer">
    <text x="1200" y="690" text-anchor="end" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="11" fill="#9AA3AF">12</text>
  </g>
</svg>
