<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <clipPath id="modelClip">
      <rect x="80" y="150" width="620" height="394" rx="14"/>
    </clipPath>
    <clipPath id="cmClip">
      <rect x="724" y="150" width="476" height="394" rx="14"/>
    </clipPath>
  </defs>

  <g id="bg">
    <rect width="1280" height="720" fill="#F5F7FA"/>
  </g>

  <g id="header">
    <rect x="80" y="50" width="5" height="60" rx="2.5" fill="#E63946"/>
    <text x="104" y="84" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1E3A5F">결정 트리, 정확도 <tspan fill="#E63946">80.18%</tspan>로 최고 성능</text>
    <text x="104" y="110" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#5C6470" letter-spacing="1">03 머신러닝 분석 · 4개 알고리즘 비교 + 혼동행렬 (테스트 5,564건)</text>
  </g>

  <g id="chart-models">
    <rect x="80" y="150" width="620" height="394" rx="14" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="1"/>
    <image href="../images/05_model_compare.png" x="95" y="162" width="590" height="370" preserveAspectRatio="xMidYMid meet" clip-path="url(#modelClip)"/>
  </g>

  <g id="chart-confusion">
    <rect x="724" y="150" width="476" height="394" rx="14" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="1"/>
    <image href="../images/06_confusion.png" x="739" y="162" width="446" height="370" preserveAspectRatio="xMidYMid meet" clip-path="url(#cmClip)"/>
  </g>

  <g id="metric-band">
    <rect x="80" y="570" width="620" height="70" rx="12" fill="#1E3A5F"/>
    <text x="180" y="598" text-anchor="middle" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="13" fill="#8DA3BB">정밀도</text>
    <text x="180" y="626" text-anchor="middle" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">0.805</text>
    <line x1="285" y1="585" x2="285" y2="625" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1"/>
    <text x="390" y="598" text-anchor="middle" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="13" fill="#8DA3BB">재현율</text>
    <text x="390" y="626" text-anchor="middle" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">0.797</text>
    <line x1="495" y1="585" x2="495" y2="625" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1"/>
    <text x="595" y="598" text-anchor="middle" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="13" fill="#8DA3BB">F1-Score</text>
    <text x="595" y="626" text-anchor="middle" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">0.801</text>
  </g>

  <g id="fn-warning">
    <rect x="724" y="570" width="476" height="70" rx="12" fill="#E63946" fill-opacity="0.09"/>
    <use data-icon="phosphor-duotone/warning" x="748" y="588" width="32" height="32" fill="#E63946"/>
    <text x="796" y="598" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2B2D33">고위험 미탐지(FN) <tspan fill="#E63946">566건</tspan></text>
    <text x="796" y="624" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="13" fill="#5C6470">놓친 고위험이 정책적 비용이 가장 큰 오류 — 개선 우선순위</text>
  </g>

  <g id="footer">
    <text x="80" y="690" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="11" fill="#9AA3AF">Source: 자체 분석 — 결정트리(max_depth=8) 80.18% / KNN(11) 78.68% / KNN(5) 78.22% / 로지스틱 77.95%</text>
    <text x="1200" y="690" text-anchor="end" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="11" fill="#9AA3AF">08</text>
  </g>
</svg>
