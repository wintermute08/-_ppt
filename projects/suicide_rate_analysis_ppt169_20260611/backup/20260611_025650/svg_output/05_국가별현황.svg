<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <clipPath id="countryClip">
      <rect x="80" y="150" width="730" height="420" rx="14"/>
    </clipPath>
  </defs>

  <g id="bg">
    <rect width="1280" height="720" fill="#F5F7FA"/>
  </g>

  <g id="header">
    <rect x="80" y="50" width="5" height="60" rx="2.5" fill="#E63946"/>
    <text x="104" y="84" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1E3A5F">최고 위험국은 구소련·동구권에 집중되어 있다</text>
    <text x="104" y="110" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#5C6470" letter-spacing="1">02 탐색적 데이터 분석 · 국가별 평균 자살률 TOP 10 (1985–2016)</text>
  </g>

  <g id="chart-country">
    <rect x="80" y="150" width="730" height="420" rx="14" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="1"/>
    <image href="../images/09_country_top10.png" x="95" y="160" width="700" height="400" preserveAspectRatio="xMidYMid meet" clip-path="url(#countryClip)"/>
  </g>

  <g id="rank-box">
    <rect x="842" y="150" width="358" height="244" rx="12" fill="#1E3A5F"/>
    <text x="874" y="190" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#8DA3BB" letter-spacing="2">TOP 5 (10만명당)</text>
    <text x="874" y="226" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="16" fill="#FFFFFF">1. 리투아니아 <tspan font-weight="bold" fill="#F4A7AE">40.4</tspan></text>
    <text x="874" y="258" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="16" fill="#FFFFFF">2. 스리랑카 <tspan font-weight="bold">35.3</tspan></text>
    <text x="874" y="290" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="16" fill="#FFFFFF">3. 러시아 <tspan font-weight="bold">34.9</tspan></text>
    <text x="874" y="322" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="16" fill="#FFFFFF">4. 헝가리 <tspan font-weight="bold">32.8</tspan></text>
    <text x="874" y="354" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="16" fill="#FFFFFF">5. 벨라루스 <tspan font-weight="bold">31.1</tspan></text>
  </g>

  <g id="why-box">
    <rect x="842" y="418" width="358" height="152" rx="12" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="1"/>
    <rect x="842" y="418" width="6" height="152" rx="3" fill="#E63946"/>
    <text x="874" y="452" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2B2D33">왜 이 지역인가?</text>
    <text x="874" y="480" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="14" fill="#5C6470">
      <tspan x="874" dy="0">1990년대 <tspan font-weight="bold" fill="#1E3A5F">체제전환기 사회 격변</tspan>과</tspan>
      <tspan x="874" dy="22">안전망 붕괴 시기가 정점과 일치 —</tspan>
      <tspan x="874" dy="22">사회적 충격이 경제 수치보다</tspan>
      <tspan x="874" dy="22">자살률에 더 크게 작용</tspan>
    </text>
  </g>

  <g id="bottom-note">
    <rect x="80" y="596" width="730" height="50" rx="10" fill="#457B9D" fill-opacity="0.10"/>
    <text x="104" y="627" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="15" fill="#2B2D33">국가 간 격차 최대 <tspan font-weight="bold" fill="#E63946">40배 이상</tspan> — 자살률은 보편 현상이 아니라 <tspan font-weight="bold" fill="#1E3A5F">사회 구조의 산물</tspan></text>
  </g>

  <g id="footer">
    <text x="80" y="690" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="11" fill="#9AA3AF">Source: Suicide Rates Overview 1985–2016 (Kaggle) · 자체 분석</text>
    <text x="1200" y="690" text-anchor="end" font-family="&quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, Arial, sans-serif" font-size="11" fill="#9AA3AF">05</text>
  </g>
</svg>
